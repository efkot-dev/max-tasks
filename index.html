<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Поручения</title>
<script src="https://st.max.ru/js/max-web-app.js"></script>
<style>
:root{--bg:#f5f7fa;--card:#fff;--txt:#1c2430;--muted:#7a8699;--blue:#2f7de1;--red:#d63b3b;--green:#3f9142;--radius:12px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--txt);font-size:15px}
.wrap{padding:16px;max-width:560px;margin:0 auto;font-size:15px}
.wrap.z1{font-size:17px}
.wrap.z2{font-size:19px}
.hdr{display:flex;align-items:center;gap:8px;margin:8px 0 12px}
.hdr h2{margin:0;flex:1}
.toprow{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.toprow .back{flex:1;margin-bottom:0}
.zoom{display:flex;gap:4px}
.zoom button{border:0;background:#e8edf4;color:var(--muted);border-radius:8px;padding:3px 8px;cursor:pointer;font-weight:700;line-height:1.1}
.zoom button.on{background:var(--blue);color:#fff}
h2{font-size:1.27em;margin:8px 0 12px}
.muted{color:var(--muted);font-size:.87em}
.card{background:var(--card);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.08);cursor:pointer}
.card .t{font-weight:600;margin:6px 0 4px}
.card .meta{font-size:.83em;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.badge{display:inline-block;font-size:.73em;font-weight:700;color:#fff;border-radius:6px;padding:2px 8px}
.overdue{color:var(--red);font-weight:700}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{flex:1;text-align:center;padding:9px 0;border-radius:10px;background:#e8edf4;color:var(--muted);font-weight:600;cursor:pointer}
.tab.on{background:var(--blue);color:#fff}
.btn{display:block;width:100%;border:0;border-radius:10px;padding:13px 0;font-size:1em;font-weight:700;cursor:pointer;margin-top:10px}
.btn.primary{background:var(--blue);color:#fff}
.btn.green{background:var(--green);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
input,textarea{width:100%;border:1px solid #d4dbe6;border-radius:10px;padding:11px;font-size:1em;font-family:inherit;background:#fff}
textarea{min-height:110px;resize:vertical}
.err{color:var(--red);font-size:.87em}
.banner{border-radius:10px;padding:9px 12px;font-size:.87em;font-weight:600;margin:10px 0}
.banner.warn{background:#fdeef4;color:#b0468c}
.banner.info{background:#e8f6f1;color:#0aa37a}
.row{margin:7px 0;font-size:.93em}
.back{display:inline-block;color:var(--blue);font-weight:600;cursor:pointer}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#22303f;color:#fff;border-radius:10px;padding:10px 18px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:9}
.report{white-space:pre-wrap;background:#f2f5f9;border-radius:10px;padding:10px;font-size:.93em;margin-top:6px}
.report.comm{background:#fff4e5}
.empty{text-align:center;color:var(--muted);padding:40px 0}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="toast"></div>
<script>
'use strict';
const API='https://script.google.com/macros/s/AKfycbyImjfw3-QrS0F4ECwf0nXMUc_MO4bTdS6VgEyoEemG8ggvsPbimUNmVP9s40GYmJbk/exec';
const ST={'Новая':'#2f7de1','В работе':'#e08a00','На доработке':'#b0468c','Отчет':'#0aa37a','Исполнено':'#3f9142','Отменено':'#8a8f98'};
let UID=null,CHAT=null,EMP=null,TAB='active',TC=null;
let FS=+(localStorage.getItem('fs')||0);
let NAV_T=null;
function clearNav(){ if(NAV_T){clearTimeout(NAV_T);NAV_T=null;} }
const $=s=>document.querySelector(s);
const app=$('#app');

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(m){const t=$('#toast');t.textContent=m;t.style.opacity=1;setTimeout(()=>t.style.opacity=0,2200);}
function api(cmd,extra){const b=Object.assign({cmd:cmd,user_id:UID,chat_id:CHAT},extra||{});
 return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(b)})
 .then(r=>r.json()).catch(()=>({ok:false,error:'нет сети'}));}
function applyFs(){app.className='wrap'+(FS?' z'+FS:'');}
function zoomHtml(){return '<div class="zoom">'+[0,1,2].map(i=>
 '<button data-z="'+i+'" class="'+(i===FS?'on':'')+'" style="font-size:'+(11+i*3)+'px" title="Размер '+(i+1)+'">A</button>').join('')+'</div>';}

function extractUid(){
 const q=new URLSearchParams(location.search); if(q.get('uid'))return q.get('uid');
 try{const w=window.WebApp;
  if(w&&w.initDataUnsafe){const u=w.initDataUnsafe;
   if(u.user&&(u.user.id||u.user.user_id))return u.user.id||u.user.user_id;
   if(u.user_id)return u.user_id;}
  if(w&&typeof w.initData==='string'&&w.initData){const p=new URLSearchParams(w.initData);
   if(p.get('user_id'))return p.get('user_id');
   const uj=p.get('user'); if(uj){const o=JSON.parse(uj); if(o.id||o.user_id)return o.id||o.user_id;}}
 }catch(e){}
 return null;
}
function extractChat(){
 try{const w=window.WebApp;
  if(w&&w.initDataUnsafe){const u=w.initDataUnsafe;
   if(u.chat&&u.chat.id)return u.chat.id;
   if(u.chat_id)return u.chat_id;}
  if(w&&typeof w.initData==='string'&&w.initData){const p=new URLSearchParams(w.initData);
   const cj=p.get('chat'); if(cj){const o=JSON.parse(cj); if(o.id)return o.id;}
   if(p.get('chat_id'))return p.get('chat_id');}
 }catch(e){}
 return null;
}
function startParam(){try{const u=window.WebApp&&window.WebApp.initDataUnsafe;return u&&u.start_param?String(u.start_param):'';}catch(e){return '';}}

function badge(t){return '<span class="badge" style="background:'+(ST[t]||'#8a8f98')+'">'+esc(t)+'</span>';}

function scrNoAccess(code){
 app.innerHTML='<div class="hdr">'+zoomHtml()+'</div><div class="empty"><h2>Доступ не настроен</h2>'+
 '<p class="muted">Ваш MAX-аккаунт не привязан к справочнику сотрудников.<br>Сообщите администратору код:</p>'+
 '<h2 style="font-size:1.8em">'+esc(code)+'</h2></div>';
}

function findCached(id){ if(!TC)return null;
 return TC.active.find(t=>String(t.id)===String(id))||TC.done.find(t=>String(t.id)===String(id))||null; }
function upsertCache(t){ if(!TC)return;
 const i=TC.active.findIndex(x=>String(x.id)===String(t.id)); if(i>=0){TC.active[i]=t;return;}
 const j=TC.done.findIndex(x=>String(x.id)===String(t.id)); if(j>=0)TC.done[j]=t; }

function scrMain(tab){
 clearNav();
 TAB=tab||'active';
 app.innerHTML='<div class="hdr"><h2>'+(EMP?esc(EMP.name):'')+'</h2>'+zoomHtml()+'</div>'+
 '<div class="tabs"><div class="tab'+(TAB==='active'?' on':'')+'" id="tA">Активные</div>'+
 '<div class="tab'+(TAB==='done'?' on':'')+'" id="tD">Выполненные</div></div>'+
 '<div id="list">'+(TC?'':'<div class="empty">Загрузка…</div>')+'</div>';
 $('#tA').onclick=()=>scrMain('active');$('#tD').onclick=()=>scrMain('done');
 if(TC)paintList(TC);
 api('tasks').then(r=>{ if(!r.ok){scrNoAccess(r.user_id||UID||'—');return;} TC=r; paintList(r); });
}
function paintList(r){
 const list=TAB==='active'?r.active:r.done;
 if(!list.length){$('#list').innerHTML='<div class="empty">'+(TAB==='active'?'Нет активных поручений':'История пуста')+'</div>';return;}
 $('#list').innerHTML=list.map(t=>
  '<div class="card" data-id="'+esc(t.id)+'">'+badge(t.status)+
  (t.overdue?' <span class="overdue">просрочено</span>':'')+
  '<div class="t">'+esc(t.text)+'</div>'+
  '<div class="meta"><span>Срок: '+esc(t.deadline)+'</span><span>'+esc(t.priority||'')+'</span></div></div>').join('');
 document.querySelectorAll('.card').forEach(c=>c.onclick=()=>scrTask(c.dataset.id));
}

function scrTask(id){
 clearNav();
 const c=findCached(id);
 if(c)paintTask(c); else app.innerHTML='<div class="empty">Загрузка…</div>';
 api('task',{id:id}).then(r=>{ if(r.ok){upsertCache(r.task);paintTask(r.task);} else if(!c){toast('Задача недоступна');scrMain();} });
}

function paintTask(t, justSent){
 clearNav();
 const editable=(t.status==='В работе'||t.status==='На доработке'||t.status==='Отчет');
 let zone='';
 if(justSent)zone='<div class="banner info">Отчёт отправлен. Возврат к списку через 5 секунд…</div>';
 else if(t.status==='Новая')zone='<button id="act" class="btn primary">Принять в работу</button>';
 else if(t.status==='В работе')zone='<textarea id="rep" placeholder="Текст отчёта: что сделано, результат…">'+esc(t.report)+'</textarea><button id="act" class="btn green">Отправить отчёт</button>';
 else if(t.status==='На доработке')zone='<div class="banner warn">Возвращено на доработку</div><textarea id="rep" placeholder="Текст отчёта…">'+esc(t.report)+'</textarea><button id="act" class="btn green">Переотправить отчёт</button>';
 else if(t.status==='Отчет')zone='<div class="banner info">Отчёт на приёмке — можно поправить и отправить заново</div><textarea id="rep">'+esc(t.report)+'</textarea><button id="act" class="btn green">Обновить отчёт</button>';
 const info=(t.comment?'<div class="row"><b>Комментарий:</b><div class="report comm">'+esc(t.comment)+'</div></div>':'')+
   (!editable&&t.report?'<div class="row"><b>Отчёт:</b><div class="report">'+esc(t.report)+'</div></div>':'');
 app.innerHTML='<div class="toprow"><span class="back" id="back">← К списку</span>'+zoomHtml()+'</div>'+
  '<h2>'+badge(t.status)+(t.overdue?' <span class="overdue">просрочено</span>':'')+'</h2>'+
  '<div class="card" style="cursor:default"><div class="t" style="font-size:1.05em">'+esc(t.text)+'</div>'+
  '<div class="row"><b>Срок:</b> '+esc(t.deadline)+'</div>'+
  '<div class="row"><b>Приоритет:</b> '+esc(t.priority||'—')+'</div>'+info+'</div>'+zone;
 $('#back').onclick=()=>scrMain();
 const btn=$('#act');
 if(btn)btn.onclick=async()=>{btn.disabled=true;
  const txt=($('#rep')||{}).value||'';
  if(t.status==='Новая'){const r2=await api('accept',{id:t.id});
   if(r2.ok){t.status='В работе';upsertCache(t);toast('Взято в работу');paintTask(t);}
   else{toast(r2.error||'ошибка');btn.disabled=false;}}
  else{const r2=await api('report',{id:t.id,text:txt});
   if(r2.ok){t.report=txt;t.comment='';if(t.status!=='Отчет')t.status='Отчет';upsertCache(t);toast('Отчёт отправлен');paintTask(t,true);
     NAV_T=setTimeout(()=>scrMain('active'),5000);}
   else{toast(r2.error||'ошибка');btn.disabled=false;}}};
}

window.addEventListener('load',()=>{
 applyFs();
 app.addEventListener('click',e=>{
  const b=e.target.closest('.zoom button'); if(!b)return;
  FS=+b.getAttribute('data-z'); localStorage.setItem('fs',FS); applyFs();
  document.querySelectorAll('.zoom button').forEach(x=>x.classList.toggle('on',+x.getAttribute('data-z')===FS));
 });
 UID=extractUid(); CHAT=extractChat();
 if(!UID){app.innerHTML='<div class="hdr">'+zoomHtml()+'</div><div class="empty"><h2>Откройте в МАКС</h2><p class="muted">Для теста в браузере добавьте ?uid=ВАШ_ID</p></div>';return;}
 const sp=startParam();
 api('init').then(r=>{
  if(r.ok){EMP=r.emp; sp?scrTask(sp):scrMain();}
  else scrNoAccess(r.user_id||UID||'—');
 });
});
</script>
</body>
</html>
